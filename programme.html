<!doctype html>
<html lang="en" data-locale="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme — D Festival</title>
<link rel="stylesheet" href="/src/styles/site.css">
<link rel="stylesheet" href="/src/styles/entrance.css">
</head>
<body>
<!-- A deep link. The entrance never auto-shows here; the requested target is
     preserved rather than redirected to the homepage. -->
<template id="d-entrance-template">
  <div class="d-entrance" role="dialog" aria-modal="true" data-state="LANGUAGE" data-media="none">
    <img class="d-entrance__poster" alt="" aria-hidden="true" hidden>
    <video class="d-entrance__video" aria-hidden="true" tabindex="-1" muted playsinline hidden></video>
    <div class="d-entrance__scrim"></div>
    <div class="d-entrance__ui">
      <div class="d-entrance__content"></div>
    </div>
  </div>
</template>

<div id="site-root">
  <header class="site-header">
    <a class="site-header__brand" href="/">D&nbsp;FESTIVAL</a>
  </header>
  <main id="main-content" class="site-main">
    <section class="site-section">
      <h1 data-i18n="programmeTitle"
          data-en="Programme"
          data-hant="節目"
          data-hans="节目">Programme</h1>
      <p id="faculty" data-i18n="facultyTitle"
         data-en="Faculty"
         data-hant="師資"
         data-hans="师资">Faculty</p>
      <p id="register" data-i18n="registerTitle"
         data-en="Register"
         data-hant="報名"
         data-hans="报名">Register</p>
    </section>
  </main>
  <footer class="site-footer">
    <button type="button" class="site-footer__replay" data-action="replay-entrance"
            data-i18n="replay" data-en="Replay entrance"
            data-hant="重播開場" data-hans="重播开场" hidden>Replay entrance</button>
  </footer>
</div>

<div id="entrance-root"></div>
<script type="module" src="/src/site/main.js"></script>
</body>
</html>
