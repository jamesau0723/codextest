<!doctype html>
<html lang="en" data-locale="en">
<head>
<meta charset="utf-8">
<!-- Zoom is retained; viewport-fit=cover exposes the safe-area insets. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D Festival</title>
<meta name="description" content="D Festival — Young Pianist Program.">
<link rel="stylesheet" href="/src/styles/site.css">
<link rel="stylesheet" href="/src/styles/entrance.css">
</head>
<body>

<!-- The entrance markup lives in a template, so a browser without JavaScript
     never renders a blocking overlay: it simply gets the usable website. -->
<template id="d-entrance-template">
  <div class="d-entrance" role="dialog" aria-modal="true" data-state="LANGUAGE" data-media="none">
    <img class="d-entrance__poster" alt="" aria-hidden="true" hidden>
    <video class="d-entrance__video" aria-hidden="true" tabindex="-1" muted playsinline hidden></video>
    <div class="d-entrance__scrim"></div>
    <div class="d-entrance__ui">
      <div class="d-entrance__content"></div>
    </div>
  </div>
</template>

<div id="site-root">
  <header class="site-header">
    <a class="site-header__brand" href="/">D&nbsp;FESTIVAL</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/programme.html">Programme</a>
      <a href="/programme.html#faculty">Faculty</a>
      <a href="/programme.html#register">Register</a>
    </nav>
  </header>

  <main id="main-content" class="site-main">
    <!-- data-reuses-entrance-video lets the entrance hand over a still-playing
         video instead of restarting one. Harmless when no video is configured. -->
    <section class="site-hero" data-reuses-entrance-video>
      <div class="site-hero__inner">
        <h1 data-i18n="heroTitle"
            data-en="D Festival"
            data-hant="D Festival"
            data-hans="D Festival">D Festival</h1>
        <p class="site-hero__lede"
           data-i18n="heroLede"
           data-en="Young Pianist Program"
           data-hant="青年鋼琴家藝術節"
           data-hans="青年钢琴家艺术节">Young Pianist Program</p>
      </div>
    </section>

    <section class="site-section">
      <h2 data-i18n="aboutTitle"
          data-en="This year&rsquo;s performances"
          data-hant="本年度演出"
          data-hans="本年度演出">This year&rsquo;s performances</h2>
      <p data-i18n="aboutBody"
         data-en="Students of the programme perform across the season."
         data-hant="課程學生於整個樂季演出。"
         data-hans="课程学生于整个乐季演出。">Students of the programme perform across the season.</p>
    </section>
  </main>

  <footer class="site-footer">
    <!-- Language links keep the site usable and switchable without JavaScript. -->
    <nav class="site-footer__langs" aria-label="Language">
      <a href="?lang=zh-Hant" lang="zh-Hant">繁體中文</a>
      <a href="?lang=zh-Hans" lang="zh-Hans">简体中文</a>
      <a href="?lang=en" lang="en">English</a>
    </nav>
    <button type="button"
            class="site-footer__replay"
            data-action="replay-entrance"
            data-i18n="replay"
            data-en="Replay entrance"
            data-hant="重播開場"
            data-hans="重播开场"
            hidden>Replay entrance</button>
  </footer>
</div>

<!-- Top-level overlay root: outside every page container, with no transformed,
     filtered or perspective ancestor that could change the containing block of
     the fixed-position entrance. -->
<div id="entrance-root"></div>

<script type="module" src="/src/site/main.js"></script>
</body>
</html>
